name: Run API Tests

on:
  workflow_dispatch:  # allows manual trigger in GitHub UI
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install app dependencies
        working-directory: server
        run: npm ci
      - name: Install Mockoon CLI
        run: npm install -g @mockoon/cli
      - name: Start Mockoon server
        run: |
          mockoon-cli start \
            -d testing/2_functional/completeness/v1.1.1/simulators/MicrowaveDeviceInventory+MockServer.json \
            --port 3002 \
            --hostname localhost &
      - name: Swap config & disable security validation
        run: |
          # 1. Replace the real config with the test config
          cp testing/2_functional/completeness/v1.1.1/simulators/config_test.json server/database/config.json
      
          # 2. Uncomment the security validation bypass in index.js
          sed -i 's|//appCommons.openApiValidatorOptions.validateSecurity = false;|appCommons.openApiValidatorOptions.validateSecurity = false;|' server/index.js
      - name: Start Node.js app
        run: |
          cd server
          node index.js &
      - name: Wait for Mockoon-MWDI-Simulator and APTP
        run: |
          echo "Giving Mockoon and APTP a few seconds to start..."
          sleep 5
          npx wait-on --timeout 60000 tcp:localhost:3002 tcp:localhost:4009
      - name: Debug server availability
        run: |
          echo "Waiting 5 seconds for services to start..."
          sleep 5
      
          echo "Checking Mockoon at port 3002..."
          curl -v http://localhost:3002 || echo "❌ Could not connect to Mockoon"
      
          echo "Checking APTP at port 4009..."
          curl -v http://localhost:4009 || echo "❌ Could not connect to APTP"
      - name: Diagnostics before tests
        run: |
          echo "Sleeping 5 extra seconds..."
          sleep 5
  
          echo "=== CONFIG FILE CONTENTS ==="
          cat server/database/config.json || echo "Config file not found!"
  
          echo
          echo "=== Checking Mockoon root ==="
          curl -i http://localhost:3002/
  
          echo
          echo "=== Checking APTP root ==="
          curl -i http://localhost:4009/
  
          echo
          echo "=== Checking failing endpoint ==="
          curl -i http://localhost:4009/v1/check-registered-availability-of-device

      - name: Run Postman tests
        run: |
          newman run testing/2_functional/completeness/v1.1.1/testcases/APTP_3rd+testcase.completeness\ Copy.postman_collection.json \
            -d testing/2_functional/completeness/v1.1.1/testcases/APTP_1.1.1+data.completeness.json \
            --reporters cli



